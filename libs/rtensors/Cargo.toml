[package]
name = "rtensors"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["cudarc"]
remote = ["serde", "bincode", "flume"]
imagers = ["image"]

[[bin]]
name = "rtensors-server"
path = "src/bin/rtensors-server.rs"
required-features = ["remote"]

[dependencies]
proc = { path = "../proc"}
cudarc = { version = "0.18.1", features = ["cuda-12000"], optional = true }
thiserror = "2.0.17"
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
flume = { version = "0.11", optional = true }
slotmap = "1.1.1"
rand = "0.9.2"
paste = "1.0.15"
tracing = "0.1.44"
image = {version = "0.25.9", optional = true}

[build-dependencies]
cc = "1.0.82"
bindgen = "0.72.1"
regex = "1.12.2"
