[package]
name = "mnist"
version = "0.1.0"
edition = "2024"

[features]
cuda = ["rtensors/cuda"]
imagers = []

[profile.release]
debug = true          # keep symbols
lto = false           # easier stacks
codegen-units = 1     # more stable call stacks

[dependencies]
image = "0.25.9"
rand = "0.9.2"
rtensors = { path = "../../libs/rtensors", features = ["imagers"] }
